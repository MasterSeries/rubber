<!-- templates/admin_dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-6">
        <!-- Header Section -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Admin Dashboard</h1>
            <a href="/logout" class="bg-red-500 text-white px-4 py-2 rounded">Logout</a>
        </div>

        <!-- Sidebar / Navigation -->
        <div class="flex space-x-4 mb-6">
            <a href="/admin" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Home</a>
            <a href="/admin/orders" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Orders</a>
            <a href="/admin/products" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Products</a>
            <a href="/admin/users" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Users</a> <!-- Link to User List -->
        </div>

        <!-- Dynamic content -->
        <div>
            {% block content %}
            <!-- Content will be injected here from other pages -->
            {% endblock %}
        </div>
    </div>
</body>
</html>

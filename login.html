<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-200 to-purple-300 min-h-screen flex items-center justify-center">
  <form action="/login" method="post" class="bg-white p-8 rounded-xl shadow-md w-80">
    <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
    <input name="username" placeholder="Username" class="w-full mb-4 p-2 border rounded" required>
    <input type="password" name="password" placeholder="Password" class="w-full mb-4 p-2 border rounded" required>
    <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Login</button>
    <p class="text-center mt-4 text-sm">No account? <a href="/signup" class="text-blue-600 hover:underline">Sign up</a></p>
  </form>
</body>
</html>

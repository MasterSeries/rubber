<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
  <h1 class="text-2xl font-bold mb-4">Your Checkout Summary</h1>
  <ul>
    {% for order in orders %}
    <li class="mb-2">
      {{ products[order.product_id].name }} × {{ order.quantity }} = ${{ "%.2f"|format(products[order.product_id].price * order.quantity) }}
    </li>
    {% endfor %}
  </ul>
  <p class="mt-4 font-semibold text-xl">Total: ${{ "%.2f"|format(total) }}</p>
</body>
</html>
